name: Digestabot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  digestabot:
    name: Digestabot
    runs-on: ubuntu-latest

    permissions:
      contents: read # Clone the repository
      id-token: write # Federate with octo-sts; sign the commit with gitsign

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # digestabot pushes with the octo-sts token; these would shadow it.
        persist-credentials: false

    # Mint a token to open the PR with — GitHub Actions isn't allowed to
    # create pull requests here. Policy in .github/chainguard.
    - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      id: octo-sts
      with:
        scope: ${{ github.repository }}
        identity: digestabot

    # Run digestabot
    - uses: chainguard-dev/digestabot@afe360aa3b0c29d88844138e8fa0349384398967 # v1.3.1
      id: digestabot
      with:
        token: ${{ steps.octo-sts.outputs.token }}
        title-for-pr: 'Update Digests'
        commit-message: 'Update Digests'
        branch-for-pr: digestabot
        labels-for-pr: ''
