name: SBOM Diff

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  sbom-diff:
    name: SBOM Diff
    runs-on: ubuntu-latest

    permissions:
      contents: read # Clone the repository
      id-token: write # Federate with octo-sts; sign the commit with gitsign

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # digestabot pushes with the octo-sts token; these would shadow it.
        persist-credentials: false

    # Mint a token to open the PR and comment on it with — GitHub Actions
    # isn't allowed to create pull requests here. Policy in .github/chainguard.
    - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      id: octo-sts
      with:
        scope: ${{ github.repository }}
        identity: sbom-diff

    # Run digestabot and diff the SPDX SBOM attestation of each updated image
    # between the old and the new digest.
    #
    # This answers the question a digest bump otherwise leaves open: the
    # digest moved, but which packages actually changed? It is off by default
    # because it fetches two SBOMs per updated image, which adds up on a
    # repository with many of them. Images that publish no SBOM -- the Docker
    # Hub and Red Hat images in `job.yaml` -- are listed as such and
    # otherwise ignored.
    - uses: chainguard-dev/digestabot@afe360aa3b0c29d88844138e8fa0349384398967 # main
      id: digestabot
      with:
        token: ${{ steps.octo-sts.outputs.token }}
        title-for-pr: 'Update Digests (+ SBOM diff)'
        commit-message: 'Update Digests (+ SBOM diff)'
        branch-for-pr: sbom-diff
        labels-for-pr: ''
        sbom-diff: true
        sbom-platform: linux/amd64

    # The action writes the package changes to the job summary and uploads the
    # full diff as an artifact. Put them on the PR as well, which is where the
    # digests are actually reviewed.
    - uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      id: find_comment
      if: ${{ steps.digestabot.outputs.pull_request_number != '' }}
      with:
        issue-number: ${{ steps.digestabot.outputs.pull_request_number }}
        body-includes: 'Package changes for each updated image.'
        token: ${{ steps.octo-sts.outputs.token }}

    - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      if: ${{ steps.digestabot.outputs.pull_request_number != '' }}
      with:
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        issue-number: ${{ steps.digestabot.outputs.pull_request_number }}
        body: |
          Package changes for each updated image.

          ${{ steps.digestabot.outputs.sbom_diff }}

          [Download the full diff](${{ steps.digestabot.outputs.sbom_diff_artifact_url }})
        token: ${{ steps.octo-sts.outputs.token }}
        edit-mode: replace
