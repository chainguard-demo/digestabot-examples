name: Cooldown

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

env:
  # The cooldown period configured on the registry, in days.
  min_age: 7

jobs:
  cooldown:
    name: Cooldown
    runs-on: ubuntu-latest

    permissions:
      contents: read # Clone the repository
      id-token: write # Federate with octo-sts; sign the commit with gitsign

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # digestabot pushes with the octo-sts token; these would shadow it.
        persist-credentials: false

    # Mint a token to open the PR and comment on it with — GitHub Actions
    # isn't allowed to create pull requests here. Policy in .github/chainguard.
    - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      id: octo-sts
      with:
        scope: ${{ github.repository }}
        identity: cooldown

    # Run digestabot, but only update to digests old enough to pull.
    #
    # A cooldown policy on the registry refuses to serve digests newer than
    # the cooldown period. Chainguard images are rebuilt often enough that the
    # latest digest of a tag is usually still inside that window, so the
    # obvious update is the one the build then can't pull. `min-age` picks the
    # most recent digest that is old enough instead, and never replaces a
    # pinned digest with an older one.
    #
    # Set it to the cooldown period configured on the registry. It reads the
    # tag history of the Chainguard registry, so it only applies to cgr.dev
    # images; the Docker Hub and Red Hat images in `job.yaml` are skipped and
    # reported in the job summary.
    - uses: chainguard-dev/digestabot@0031b8db9dd4e9a1159893c787a0e75875b0ac4d # main
      id: digestabot
      with:
        token: ${{ steps.octo-sts.outputs.token }}
        title-for-pr: 'Update Digests (+ cooldown)'
        commit-message: 'Update Digests (+ cooldown)'
        branch-for-pr: cooldown
        labels-for-pr: ''
        min-age: ${{ env.min_age }}

    # Put the digest each image was held at next to the newest one in its tag
    # history. Without this the PR just looks like an ordinary digest bump --
    # the gap between the two columns is the whole point of `min-age`, and it
    # is the part you can't see from the diff.
    #
    # The history is the same Chainguard registry API that `min-age` itself
    # reads, so a repository token is enough.
    - name: Summarise the cooldown
      id: cooldown
      if: ${{ steps.digestabot.outputs.pull_request_number != '' }}
      shell: bash
      env:
        UPDATES: ${{ steps.digestabot.outputs.json }}
        MIN_AGE: ${{ env.min_age }}
      run: |
        table="${RUNNER_TEMP}/cooldown.md"
        : > "${table}"

        while read -r update; do
          image=$(jq -r '.image' <<<"${update}")
          picked=$(jq -r '.updated_digest' <<<"${update}")

          # Only cgr.dev tags have a history to read; min-age skips the rest.
          [[ "${image}" == cgr.dev/* ]] || continue

          repo=${image#cgr.dev/}
          tag=${repo##*:}
          repo=${repo%:*}

          token=$(curl -fsSL "https://cgr.dev/token?service=cgr.dev&scope=repository:${repo}:pull" | jq -r '.token')
          curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://cgr.dev/v2/${repo}/_chainguard/history/${tag}" |
            jq -r --arg image "${image}" --arg picked "${picked}" --argjson now "$(date +%s)" '
              def on($t): if $t == null then "?" else ($t | todate | .[:10]) end;
              def age($t): if $t == null then "?" else "\((($now - $t) / 86400) | floor) days" end;
              [.history[] | {digest, t: (.updateTimestamp | sub("\\.[0-9]+"; "") | fromdateiso8601)}]
              | sort_by(.t) as $h
              | ($h | last) as $newest
              | (($h | map(select(.digest == $picked)) | last) // {digest: $picked, t: null}) as $p
              | "| `\($image)` | `\($p.digest[7:19])` | \(on($p.t)) | \(age($p.t)) "
                + "| `\($newest.digest[7:19])` | \(on($newest.t)) | \(age($newest.t)) |"
            ' >> "${table}"
        done < <(jq -c '.updates // [] | .[]' <<<"${UPDATES}")

        [ -s "${table}" ] || exit 0

        delimiter="EOF_$(openssl rand -hex 16)"
        {
          echo "body<<${delimiter}"
          echo "Digests held back by the ${MIN_AGE} day cooldown."
          echo
          echo "Where the two digests differ, a newer one exists that the registry"
          echo "won't serve yet."
          echo
          echo "| Image | Picked | Pushed | Age | Newest | Pushed | Age |"
          echo "| ----- | ------ | ------ | --- | ------ | ------ | --- |"
          cat "${table}"
          echo "${delimiter}"
        } >> "${GITHUB_OUTPUT}"

    - uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      id: find_comment
      if: ${{ steps.cooldown.outputs.body != '' }}
      with:
        issue-number: ${{ steps.digestabot.outputs.pull_request_number }}
        body-includes: 'day cooldown.'
        token: ${{ steps.octo-sts.outputs.token }}

    - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      if: ${{ steps.cooldown.outputs.body != '' }}
      with:
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        issue-number: ${{ steps.digestabot.outputs.pull_request_number }}
        body: ${{ steps.cooldown.outputs.body }}
        token: ${{ steps.octo-sts.outputs.token }}
        edit-mode: replace
