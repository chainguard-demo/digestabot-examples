name: Verify Signatures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  verify-signatures:
    name: Verify Signatures
    runs-on: ubuntu-latest

    permissions:
      contents: read # Clone the repository
      id-token: write # Federate with octo-sts; sign the commit with gitsign

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # digestabot pushes with the octo-sts token; these would shadow it.
        persist-credentials: false

    # Mint a token to open the PR with — GitHub Actions isn't allowed to
    # create pull requests here. Policy in .github/chainguard.
    - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      id: octo-sts
      with:
        scope: ${{ github.repository }}
        identity: verify-signatures

    # Run digestabot, verifying the cosign signature of every new digest
    # before it is written to a file. An update that doesn't verify is skipped
    # and the old digest is left in place, so an unverified image never
    # reaches the PR; the rest of the updates still go in.
    #
    # Images no rule matches are updated without verification, which is what
    # happens to the Docker Hub and Red Hat images in `job.yaml` -- neither
    # carries a keyless signature, so covering them would skip every update of
    # them. digestabot installs cosign itself when a policy is set.
    - uses: chainguard-dev/digestabot@0031b8db9dd4e9a1159893c787a0e75875b0ac4d # main
      id: digestabot
      with:
        token: ${{ steps.octo-sts.outputs.token }}
        title-for-pr: 'Update Digests (+ `cosign verify`)'
        commit-message: 'Update Digests (+ `cosign verify`)'
        branch-for-pr: verify-signatures
        labels-for-pr: ''
        verify-signatures: |
          - images: cgr.dev/chainguard/
            identity: https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main
            issuer: https://token.actions.githubusercontent.com

    # A skipped update doesn't fail the job on its own, which would leave the
    # digest quietly pinned to the old value run after run. Fail the workflow
    # so someone looks: a digest that stops verifying is either a signing
    # change to follow or something worse.
    - name: Fail on skipped updates
      if: ${{ steps.digestabot.outputs.verification_failures != '' && steps.digestabot.outputs.verification_failures != '[]' }}
      shell: bash
      env:
        FAILURES: ${{ steps.digestabot.outputs.verification_failures }}
      run: |
        jq -r '.[] | "\(.image) was not updated to \(.updated_digest) in \(.file): \(.error)"' <<<"${FAILURES}"
        exit 1
