# Push the branch and open the PR for the Grype Scan workflow, comment the
# scan results on it, and register the check run that fails on High/Critical
# findings.
issuer: https://token.actions.githubusercontent.com
subject: repo:chainguard-demo/digestabot-examples:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: chainguard-demo/digestabot-examples/.github/workflows/grype-scan.yaml@refs/heads/main

permissions:
  contents: write
  pull_requests: write
  checks: write
