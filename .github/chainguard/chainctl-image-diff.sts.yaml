# Push the branch and open the PR for the Chainctl Image Diff workflow.
# digestabot itself runs with create-pr: false here; the PR is opened by
# peter-evans/create-pull-request once the diff has filtered the updates.
issuer: https://token.actions.githubusercontent.com
subject: repo:chainguard-demo/digestabot-examples:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: chainguard-demo/digestabot-examples/.github/workflows/chainctl-image-diff.yaml@refs/heads/main

permissions:
  contents: write
  pull_requests: write
